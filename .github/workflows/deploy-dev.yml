name: Deploy to cPanel Development

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Replace config tokens
        env:
          DB_HOST: ${{ secrets.HOSTINGER_DB_HOST }}
          DB_NAME: ${{ secrets.HOSTINGER_DB_NAME }}
          DB_USER: ${{ secrets.HOSTINGER_DB_USER }}
          DB_PASS: ${{ secrets.HOSTINGER_DB_PASS }}
          DB_PORT: ${{ secrets.HOSTINGER_DB_PORT }}
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
        run: |
          # A missing secret resolves to an empty string; stop before uploading a broken config.php
          missing=0
          for name in DB_HOST DB_NAME DB_USER DB_PASS DB_PORT MIGRATE_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name is empty or missing — check the secret names in this workflow"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          sed -i "s/{{DB_HOST}}/${DB_HOST}/g" includes/config.php
          sed -i "s/{{DB_NAME}}/${DB_NAME}/g" includes/config.php
          sed -i "s/{{DB_USER}}/${DB_USER}/g" includes/config.php
          sed -i "s/{{DB_PASS}}/${DB_PASS}/g" includes/config.php
          sed -i "s/{{DB_PORT}}/${DB_PORT}/g" includes/config.php
          sed -i "s/{{MIGRATE_TOKEN}}/${MIGRATE_TOKEN}/g" includes/config.php

          # Every placeholder must be gone
          if grep -n '{{[A-Z_]*}}' includes/config.php; then
            echo "::error::Unreplaced placeholders remain in includes/config.php"
            exit 1
          fi

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: /qa/
          protocol: ftps

      # Apply pending database migrations right after the new code is live.
      # Fails the deploy (red run) if the token is missing/wrong or a migration errors.
      - name: Run database migrations
        env:
          MIGRATE_URL: https://astroestimations.com/qa/migrate.php
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
        run: |
          if [ -z "$MIGRATE_TOKEN" ]; then
            echo "::error::MIGRATE_TOKEN secret is not set — cannot run migrations"
            exit 1
          fi
          status=$(curl -sS --retry 3 --retry-delay 5 -o response.json -w '%{http_code}' \
            --data-urlencode "token=$MIGRATE_TOKEN" "$MIGRATE_URL")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Migrations failed (HTTP $status)"
            exit 1
          fi
