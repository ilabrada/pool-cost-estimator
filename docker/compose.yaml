# Local development stack: PHP 8.3 + Apache and MariaDB 11.8 (matches production).
# Usage (from the repo root):
#   docker compose -f docker/compose.yaml up -d --build
#   open http://localhost:8090
name: pool-estimator

services:
  app:
    build: .
    ports:
      - "8090:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: pool_estimator
      DB_USER: pool_estimator
      DB_PASS: pool_dev_password
    volumes:
      # Live-mount the project so code edits show up without rebuilding
      - ..:/var/www/html
      # Container-only DB settings; your host includes/config.local.php is left untouched
      - ./config.local.php:/var/www/html/includes/config.local.php:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: pool_estimator
      MARIADB_USER: pool_estimator
      MARIADB_PASSWORD: pool_dev_password
      MARIADB_ROOT_PASSWORD: pool_dev_root
    ports:
      # 3307 on the host, so it doesn't clash with a locally installed MariaDB on 3306
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
